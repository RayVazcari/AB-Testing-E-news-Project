<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070f"/><stop offset="1" stop-color="#1a0630"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/><stop offset="1" stop-color="#ff2a6d"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00f0ff" stroke-opacity="0.07"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" fill-opacity="0.25"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1000" height="240"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1000" height="240" fill="url(#bg)"/>
    <rect width="1000" height="240" fill="url(#grid)"/>
    <text x="960" y="215" text-anchor="end" font-family="'Courier New', monospace" font-weight="bold" font-size="170" fill="#ff2a6d" fill-opacity="0.10">02</text>
    <text x="50" y="62" font-family="'Courier New', monospace" font-size="15" fill="#ff2a6d" letter-spacing="3" filter="url(#glow)">&gt; PROJECT_02 // BUSINESS STATISTICS</text>
    <g font-family="'Courier New', monospace" font-weight="bold" font-size="52" letter-spacing="1">
      <text x="47" y="132" fill="#ff2a6d" opacity="0.75"><animate attributeName="x" values="47;51;47;46;47" dur="4s" repeatCount="indefinite"/>E-NEWS A/B TEST</text>
      <text x="53" y="128" fill="#00f0ff" opacity="0.75"><animate attributeName="x" values="53;49;53;54;53" dur="4s" repeatCount="indefinite"/>E-NEWS A/B TEST</text>
      <text x="50" y="130" fill="#ffffff" filter="url(#glow)">E-NEWS A/B TEST</text>
    </g>
    <rect x="50" y="152" width="420" height="3" fill="url(#neon)" filter="url(#glow)"/>
    <text x="50" y="188" font-family="'Courier New', monospace" font-size="16" fill="#9aa0c8" letter-spacing="1">RAY VAZQUEZ  //  DATA &amp; ML SCIENTIST<tspan fill="#00f0ff"> &#9608;</tspan></text>
    <rect width="1000" height="240" fill="url(#scan)"/>
    <rect y="-30" width="1000" height="30" fill="#00f0ff" fill-opacity="0.06">
      <animate attributeName="y" values="-30;240" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="1.5" y="1.5" width="997" height="237" fill="none" stroke="url(#neon)" stroke-width="3"/>
  <path d="M0 36V0H36M964 0H1000V36M1000 204V240H964M36 240H0V204" fill="none" stroke="#f9f002" stroke-width="4"/>
</svg>
